# Verifie les licences et les vulnerabilites des dependances.
# Lance par la CI : `cargo deny check`.

[advisories]
yanked = "deny"
# Une vulnerabilite fait echouer la CI. Un crate seulement "non maintenu" est
# ignore : ceux qui remontent ici viennent des dependances de winit et de wgpu,
# et bloquer sur eux casserait la CI sans qu'aucune action soit possible de
# notre cote. La vraie reponse est de suivre les mises a jour amont.
ignore = [
    # ttf-parser, tire par winit pour les decorations Wayland.
    "RUSTSEC-2026-0192",
]

[licenses]
# Raster est sous MIT. Ces licences sont compatibles avec une redistribution
# sous MIT ; toute autre demande un examen avant d'entrer dans l'arbre.
#
# Certaines ne correspondent a aucune dependance actuelle et remontent un
# avertissement : c'est voulu. Les retirer ferait echouer la CI au premier
# crate qui les emploie, pour ne gagner qu'une ligne de sortie.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
# Les dependances de chemin du workspace n'ont pas de version : elles sont
# resolues localement, pas depuis un registre.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
