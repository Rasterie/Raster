[workspace]
resolver = "3"
members = [
    "crates/raster-math",
    "crates/raster-derive",
    "crates/raster-core",
    "crates/raster-render",
    "crates/raster-input",
    "crates/raster-2d",
    "crates/raster-physics",
    "crates/raster-audio",
    "games/keystone",
]

# Crates are added as their milestone arrives — see TODO.md.

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Rasterie/Raster"
authors = ["Gabin Capelle"]

[workspace.dependencies]
# Foundations, kept external on purpose — see docs/decisions/008.
# rasterie-engine = { git = "https://github.com/Rasterie/engine" }
# resonance-core  = { git = "https://github.com/Rasterie/resonance" }

[profile.dev]
opt-level = 1          # the engine is unusable at opt-level 0

[profile.dev.package."*"]
opt-level = 3          # dependencies are compiled once; always optimise them
